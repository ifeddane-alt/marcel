server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Sécurité HTTP headers ──────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; frame-ancestors 'none';" always;
    # HSTS activé uniquement si HTTPS (décommentez en production avec Traefik)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy des appels API vers le backend FastAPI
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    300s;
        proxy_connect_timeout  75s;
        client_max_body_size   50M;
    }

    # ── Site vitrine (HTML statique — SEO & crawlers IA) ──────────────────────
    location = / { try_files /site/index.html =404; }
    location = /fonctionnalites { try_files /site/fonctionnalites.html =404; }
    location = /fonctionnalites/portefeuille { try_files /site/fonctionnalites/portefeuille.html =404; }
    location = /fonctionnalites/projets { try_files /site/fonctionnalites/projets.html =404; }
    location = /fonctionnalites/ressources { try_files /site/fonctionnalites/ressources.html =404; }
    location = /fonctionnalites/budgets { try_files /site/fonctionnalites/budgets.html =404; }
    location = /fonctionnalites/gouvernance { try_files /site/fonctionnalites/gouvernance.html =404; }
    location = /fonctionnalites/reporting { try_files /site/fonctionnalites/reporting.html =404; }
    location = /cas-usage { try_files /site/cas-usage.html =404; }
    location = /contact { try_files /site/contact.html =404; }
    location = /en { return 301 /en/; }
    location = /en/ { try_files /site/en/index.html =404; }
    location = /en/features { try_files /site/en/features.html =404; }
    location = /en/features/portfolio { try_files /site/en/features/portfolio.html =404; }
    location = /en/features/projects { try_files /site/en/features/projects.html =404; }
    location = /en/features/resources { try_files /site/en/features/resources.html =404; }
    location = /en/features/budgets { try_files /site/en/features/budgets.html =404; }
    location = /en/features/governance { try_files /site/en/features/governance.html =404; }
    location = /en/features/reporting { try_files /site/en/features/reporting.html =404; }
    location = /en/use-cases { try_files /site/en/use-cases.html =404; }
    location = /en/contact { try_files /site/en/contact.html =404; }

    # Fallback SPA — toutes les routes React sont servies par index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compression gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
