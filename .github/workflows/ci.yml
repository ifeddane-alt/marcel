name: CI — MARCEL

on:
  workflow_dispatch:
  pull_request:
    branches: ['**']
  push:
    branches: [main]

jobs:
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt \
            --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/ \
            || pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: marcel_ci_test
          JWT_SECRET: ci_test_secret_key_not_production
          ANTHROPIC_API_KEY: skip
          SKIP_LICENSE_CHECK: "true"
          PYTHONPATH: .
        run: |
          pytest tests/ -x -q \
            --ignore=tests/test_agent.py \
            --ignore=tests/test_agent_wf.py \
            --ignore=tests/test_items_13_19.py \
            -k "not sap and not connector_sync" \
            || true

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install
        working-directory: frontend
        run: yarn install --frozen-lockfile || yarn install

      - name: Build
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: http://localhost:8001
          CI: false
          DISABLE_ESLINT_PLUGIN: true
        run: yarn build
